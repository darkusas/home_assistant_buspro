name: Tests

on:
  push:
  pull_request:
  workflow_call:  # run by release.yml before a release

permissions:
  contents: read

jobs:
  library:
    name: Library and scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest

  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test_ha.txt
      - run: pytest tests_ha

  panel:
    name: Panel in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The runner image has Google Chrome, so no browser download (playwright install
      # --with-deps took up to 9 minutes when the package mirrors were slow).
      - run: npm install --no-save playwright@1.64.0
      - run: node tests_frontend/panel_test.cjs
        env:
          PANEL_TEST_CHANNEL: chrome
