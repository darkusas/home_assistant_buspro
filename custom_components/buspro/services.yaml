scan:
  name: Scan HDL bus
  description: >-
    Find HDL Buspro devices, their channels and the names stored in them. Read-only:
    nothing is switched. Takes about a minute; call it with "return response" to see the result.
  fields:
    rounds:
      name: Search rounds
      description: How many times to repeat the device search. One round reaches about 87% of devices.
      default: 4
      selector:
        number:
          min: 1
          max: 10
    interval:
      name: Round length
      description: Seconds per search round. Devices answer within about 5 seconds.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
    read_names:
      name: Read channel names
      description: Read the name of every output and curtain channel.
      default: true
      selector:
        boolean:
    read_mac:
      name: Read MAC addresses
      description: Read each device's MAC address, which stays the same when its address changes.
      default: true
      selector:
        boolean:
test_channel:
  name: Test HDL channel
  description: >-
    Switch a channel, curtain or universal switch directly on the bus and report what the
    device answered, to check it is the right one before adding it. This switches the real
    load. A pulse turns the channel on for a few seconds and then restores its previous level.
  fields:
    address:
      name: Device address
      description: Subnet ID and device ID, e.g. 1.89.
      required: true
      example: "1.89"
      selector:
        text:
    channel:
      name: Channel
      description: Channel, curtain or universal switch number.
      required: true
      selector:
        number:
          min: 1
          max: 255
    target:
      name: Target
      description: What the number refers to.
      default: output
      selector:
        select:
          options:
            - output
            - curtain
            - universal_switch
    action:
      name: Action
      description: "Outputs: on, off, level, pulse. Curtains: open, close, stop. Universal switches: on, off."
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
            - level
            - pulse
            - open
            - close
            - stop
    level:
      name: Level
      description: Level for 'level', or for 'pulse' (default 100).
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    duration:
      name: Pulse length
      description: Seconds the channel stays on during a pulse.
      default: 2
      selector:
        number:
          min: 0.5
          max: 30
          step: 0.5
          unit_of_measurement: s
